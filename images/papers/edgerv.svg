<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="EdgeRV: A scalable meta-instruction-driven RISC-V coprocessor for edge DNN inference. Journal of Systems Architecture, 2026.">
  <title>EdgeRV</title>
  <desc>Title-based illustration of a scalable RISC-V coprocessor with labels for meta-instructions and edge DNN inference.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.55" stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#f7f3ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1200" height="675" rx="42" fill="url(#bg)"/>
  <circle cx="1020" cy="90" r="170" fill="#2563eb" opacity="0.14"/>
  <circle cx="120" cy="610" r="210" fill="#14b8a6" opacity="0.10"/>
  <g filter="url(#shadow)">
    <rect x="64" y="70" width="1072" height="535" rx="34" fill="white" opacity="0.88"/>
  </g>
  <g font-family="Inter, Arial, sans-serif">
    <text x="96" y="135" font-size="28" font-weight="800" fill="#2563eb">PAPER HIGHLIGHT</text>
    <text x="1096" y="135" text-anchor="end" font-size="24" font-weight="700" fill="#475569">JSA · 2026</text>
    <text x="96" y="190" font-size="46" font-weight="800" fill="#0f172a">EdgeRV</text>
    <text x="96" y="236" font-size="24" fill="#475569">
      <tspan x="96">A scalable meta-instruction-driven RISC-V coprocessor</tspan>
      <tspan x="96" dy="34">for edge DNN inference</tspan>
    </text>
    <g transform="translate(132 330)">
      <g stroke="#60a5fa" stroke-width="8" stroke-linecap="round">
        <path d="M48 0 V24 M96 0 V24 M144 0 V24 M192 0 V24 M48 224 V248 M96 224 V248 M144 224 V248 M192 224 V248"/>
        <path d="M0 56 H24 M0 104 H24 M0 152 H24 M0 200 H24 M216 56 H240 M216 104 H240 M216 152 H240 M216 200 H240"/>
      </g>
      <rect x="24" y="24" width="192" height="200" rx="26" fill="#dbeafe" stroke="#2563eb" stroke-width="5"/>
      <rect x="48" y="48" width="144" height="152" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="3"/>
      <text x="120" y="118" text-anchor="middle" font-size="30" font-weight="800" fill="#1d4ed8">RISC-V</text>
      <text x="120" y="153" text-anchor="middle" font-size="21" font-weight="700" fill="#475569">coprocessor</text>
    </g>
    <g transform="translate(438 332)">
      <rect width="644" height="60" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
      <text x="28" y="39" font-size="28" font-weight="800" fill="#1d4ed8">Meta-instructions</text>
      <rect y="82" width="644" height="60" rx="18" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/>
      <text x="28" y="121" font-size="28" font-weight="800" fill="#0f766e">Scalable coprocessor</text>
      <rect y="164" width="644" height="60" rx="18" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="2"/>
      <text x="28" y="203" font-size="28" font-weight="800" fill="#6d28d9">Edge DNN inference</text>
    </g>
  </g>
</svg>
